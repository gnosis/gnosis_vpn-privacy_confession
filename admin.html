<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin // Privacy Confession</title>
  <style>
    /* Gnosis VPN brand, same as page 3 ("private web") of the confession site */
    @font-face {
      font-family: 'Unica77 LL';
      src: url('/fonts/Unica77LL-Regular.otf') format('opentype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Unica77 LL';
      src: url('/fonts/Unica77LL-Bold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Unica77 LL', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, #331bce 0%, #331bce 40%, #ffffa0 100%) fixed;
      color: #1f1f1f;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-overlay {
      display: flex;
      gap: 1.5rem;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    #login-card {
      max-width: 400px;
      width: 100%;
      background: #fff;
      border-radius: 32px;
      padding: 2rem;
      text-align: center;
    }

    .label {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    input[type="password"] {
      width: 100%;
      border: 1px solid #d9d7ef;
      border-radius: 12px;
      font: inherit;
      padding: 0.75rem;
      outline: none;
      margin-bottom: 1rem;
    }
    input[type="password"]:focus { border-color: #4336de; }

    #login-error {
      font-size: 0.9rem;
      color: #d0021b;
      margin-top: 0.75rem;
      display: none;
    }

    /* ── BUTTONS ── */
    button {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: #4336de;
      color: #fff;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    button:hover { background: #3b30c4; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.sm {
      width: auto;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
    }
    button.danger { background: #fff; color: #d0021b; border: 1px solid #d0021b; }
    button.danger:hover { background: #d0021b; color: #fff; }
    button.dim { background: transparent; color: #fff; border: 1px solid #fff; }
    button.dim:hover { background: #fff; color: #331bce; }
    /* white buttons where the background is already purple */
    header button.sm:not(.dim), .col-title button { background: #fff; color: #331bce; }
    header button.sm:not(.dim):hover, .col-title button:hover { background: #ecebf7; }

    /* ── ADMIN PANEL ── */
    #admin-panel { display: none; }

    header {
      position: sticky;
      top: 0;
      padding: 1rem 2rem;
      background: #331bce;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      z-index: 5;
    }
    header h1 {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.1rem;
      font-weight: 700;
    }
    header h1 img { height: 24px; }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; }
    #status-msg {
      font-size: 0.85rem;
      min-width: 140px;
      text-align: right;
    }

    /* ── SPLIT LAYOUT ── */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      align-items: start;
    }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; padding: 1rem; }
    }
    .col-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    .col-title .count { font-weight: 400; opacity: 0.8; margin-left: 0.4rem; margin-right: auto; }

    .confession-list { display: flex; flex-direction: column; gap: 1rem; }
    .confession-card {
      background: #fff;
      border-radius: 24px;
      padding: 1.25rem 1.5rem;
    }
    .confession-text {
      font-size: 1.05rem;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .confession-meta {
      font-size: 0.8rem;
      color: #6b6b80;
      margin-bottom: 0.9rem;
    }
    .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .signup-answers { font-size: 0.9rem; line-height: 1.5; margin-bottom: 0.75rem; overflow-wrap: anywhere; }
    .signup-answers p { padding: 0.4rem 0; border-top: 1px solid #ecebf7; }
    .signup-answers span { display: block; color: #6b6b80; font-size: 0.8rem; }

    .empty-state {
      background: #fff;
      border-radius: 24px;
      padding: 1.25rem 1.5rem;
      color: #6b6b80;
    }

    footer {
      padding: 0.9rem 2rem;
      font-size: 0.8rem;
      color: #331bce;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-overlay">
    <img src="/gnosis_vpn.svg" alt="Gnosis VPN" style="height: 32px;">
    <div id="login-card">
      <div class="label">Privacy Confessional admin</div>
      <input type="password" id="pw-input" placeholder="Admin password" autocomplete="current-password">
      <button id="login-btn">Log in</button>
      <div id="login-error">Wrong password</div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel">
    <header>
      <h1><img src="/gnosis_vpn.svg" alt="Gnosis VPN"> Privacy Confessional admin</h1>
      <div class="header-actions">
        <span id="status-msg"></span>
        <button class="sm" id="download-btn">Download confessions</button>
        <button class="sm dim" id="logout-btn">Log out</button>
      </div>
    </header>

    <div class="split">
      <div class="col">
        <div class="col-title">Confessions <span class="count" id="confession-count"></span></div>
        <div class="confession-list" id="confession-list"></div>
      </div>
      <div class="col">
        <div class="col-title">Waitlist <span class="count" id="waitlist-count"></span>
          <button class="sm" id="refresh-btn">Refresh</button>
          <button class="sm" id="csv-btn">Download CSV</button>
        </div>
        <div class="confession-list" id="waitlist-list"></div>
      </div>
    </div>

    <footer>
      <span>Gnosis VPN · Privacy Confessional</span>
      <span id="footer-clock"></span>
    </footer>
  </div>

  <script>
    const loginOverlay = document.getElementById('login-overlay');
    const adminPanel   = document.getElementById('admin-panel');

    function pad(n) { return String(n).padStart(2, '0'); }

    function fmt(ts) {
      const d = new Date(ts * 1000);
      return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join('-') + ' ' +
             [pad(d.getHours()), pad(d.getMinutes()), pad(d.getSeconds())].join(':');
    }

    (function tickClock() {
      const d = new Date();
      document.getElementById('footer-clock').textContent =
        [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join('-') + ' ' +
        [pad(d.getHours()), pad(d.getMinutes()), pad(d.getSeconds())].join(':');
      setTimeout(tickClock, 1000);
    })();

    function setStatus(msg) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      setTimeout(() => { el.textContent = ''; }, 2500);
    }

    // ── LOGIN ──
    const pwInput  = document.getElementById('pw-input');
    const loginBtn = document.getElementById('login-btn');
    const loginErr = document.getElementById('login-error');

    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true;
      loginErr.style.display = 'none';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwInput.value })
        });
        if (res.ok) {
          showPanel();
        } else {
          loginErr.style.display = 'block';
          loginBtn.disabled = false;
        }
      } catch {
        loginErr.style.display = 'block';
        loginBtn.disabled = false;
      }
    });

    // ── LOGOUT ──
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      adminPanel.style.display   = 'none';
      loginOverlay.style.display = 'flex';
      pwInput.value = '';
      loginBtn.disabled = false;
    });

    // ── DOWNLOAD ──
    document.getElementById('download-btn').addEventListener('click', () => {
      window.location.href = '/api/admin/download';
    });

    // ── PANEL ──
    function showPanel() {
      loginOverlay.style.display = 'none';
      adminPanel.style.display   = 'block';
      loadConfessions();
      loadWaitlist();
    }

    async function apiCall(method, url) {
      const res = await fetch(url, { method });
      if (res.status === 401) {
        adminPanel.style.display   = 'none';
        loginOverlay.style.display = 'flex';
        loginBtn.disabled = false;
        throw new Error('session expired');
      }
      return res;
    }

    function makeCard(c) {
      const card = document.createElement('div');
      card.className = 'confession-card';

      const text = document.createElement('p');
      text.className = 'confession-text';
      text.textContent = c.text;

      const meta = document.createElement('p');
      meta.className = 'confession-meta';
      meta.textContent = '#' + c.id + '  ·  ' + fmt(c.submitted_at);

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const del = document.createElement('button');
      del.className = 'sm danger';
      del.textContent = 'Delete';
      del.addEventListener('click', () => deleteConfession(c.id));

      actions.append(del);

      card.append(text, meta, actions);
      return card;
    }

    async function loadConfessions() {
      try {
        const res  = await apiCall('GET', '/api/admin/confessions');
        const rows = await res.json();

        document.getElementById('confession-count').textContent = '(' + rows.length + ')';

        const list = document.getElementById('confession-list');
        list.innerHTML = '';

        if (rows.length === 0) {
          list.innerHTML = '<p class="empty-state">No confessions yet</p>';
        } else {
          rows.forEach(c => list.appendChild(makeCard(c)));
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteConfession(id) {
      try {
        await apiCall('DELETE', '/api/admin/confession/' + id);
        setStatus('deleted #' + id);
        loadConfessions();
      } catch (e) {
        console.error(e);
      }
    }

    // ── WAITLIST ──
    // Sign-ups aren't polled: each load decrypts every contact, so it only runs on login, Refresh and after a delete
    document.getElementById('refresh-btn').addEventListener('click', loadWaitlist);

    document.getElementById('csv-btn').addEventListener('click', () => {
      window.location.href = '/api/admin/waitlist.csv';
    });

    function makeSignupCard(s, questions) {
      const card = document.createElement('div');
      card.className = 'confession-card';

      const contact = document.createElement('p');
      contact.className = 'confession-text';
      contact.textContent = s.contact_channel + ': ' + s.contact;

      const answers = document.createElement('div');
      answers.className = 'signup-answers';
      questions.filter(q => s.answers[q.id] !== undefined).forEach(q => {
        const line = document.createElement('p');
        const label = document.createElement('span');
        label.textContent = q.label;
        line.append(label, [].concat(s.answers[q.id]).join('; '));
        answers.appendChild(line);
      });

      const meta = document.createElement('p');
      meta.className = 'confession-meta';
      meta.textContent = 'sent on ' + s.sent_on;

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const del = document.createElement('button');
      del.className = 'sm danger';
      del.textContent = 'Delete';
      del.addEventListener('click', () => deleteSignup(s));

      actions.append(del);

      card.append(contact, answers, meta, actions);
      return card;
    }

    async function loadWaitlist() {
      try {
        const res = await apiCall('GET', '/api/admin/waitlist');
        if (!res.ok) {
          setStatus("Couldn't load the waitlist");
          return;
        }
        const { questions, signups } = await res.json();

        document.getElementById('waitlist-count').textContent = '(' + signups.length + ')';

        const list = document.getElementById('waitlist-list');
        list.innerHTML = '';

        if (signups.length === 0) {
          list.innerHTML = '<p class="empty-state">No sign-ups yet</p>';
        } else {
          signups.forEach(s => list.appendChild(makeSignupCard(s, questions)));
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteSignup(s) {
      if (!confirm('Delete the sign-up of ' + s.contact + '? This cannot be undone.')) return;
      try {
        const res = await apiCall('DELETE', '/api/admin/waitlist/' + encodeURIComponent(s.id));
        setStatus(res.ok ? 'Sign-up deleted' : "Couldn't delete the sign-up");
        loadWaitlist();
      } catch (e) {
        console.error(e);
      }
    }

    // Check if already authenticated on page load
    fetch('/api/admin/confessions').then(res => {
      if (res.ok) showPanel();
    }).catch(() => {});

    setInterval(loadConfessions, 15000);
  </script>
</body>
</html>
